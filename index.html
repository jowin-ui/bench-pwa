<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1F33">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>The Bench — Code Workbench</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root{
    --bg: #0B1F33;
    --bg-grid: #123153;
    --card: #102A43;
    --card-hi: #163A57;
    --line: #1E4368;
    --ink: #E8F1F8;
    --ink-dim: #7FA8C9;
    --teal: #5EEAD4;
    --coral: #E8927C;
    --amber: #F0C36D;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; margin:0; overscroll-behavior:none; }
  body{
    background:
      linear-gradient(var(--bg-grid) 1px, transparent 1px) 0 0/28px 28px,
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px) 0 0/28px 28px,
      var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection{ background: var(--teal); color: #06222A; }
  button{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11.5px; letter-spacing:.03em;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 8px 10px;
    cursor:pointer;
    border-radius: 3px;
  }
  button:hover{ background: var(--card-hi); border-color: var(--teal); }
  button.primary{ background: var(--teal); color:#06222A; border-color:var(--teal); font-weight:600; }
  button.primary:hover{ filter: brightness(1.08); }
  button.ghost{ background:transparent; border-color:transparent; }
  button.danger:hover{ border-color: var(--coral); color: var(--coral); }
  button:disabled{ opacity:.4; cursor:not-allowed; }

  /* ---------- Lock screen ---------- */
  #lock{
    position:fixed; inset:0; z-index:100;
    display:flex; align-items:center; justify-content:center;
    background: var(--bg);
    flex-direction:column; padding: 24px;
  }
  #lock .pin-card{
    width: min(320px, 90vw);
    background: var(--card); border:1px solid var(--line); border-radius:6px;
    padding: 26px 22px; text-align:center;
  }
  #lock h1{ font-family:'IBM Plex Mono', monospace; font-size:16px; color:var(--teal); margin:0 0 6px; letter-spacing:.08em; text-transform:uppercase; }
  #lock p{ font-size:12px; color:var(--ink-dim); margin: 0 0 18px; line-height:1.6; }
  .pin-dots{ display:flex; gap:12px; justify-content:center; margin-bottom:18px; }
  .pin-dot{ width:14px; height:14px; border-radius:50%; border:1px solid var(--line); background:transparent; }
  .pin-dot.filled{ background: var(--teal); border-color:var(--teal); }
  .pin-pad{ display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin-bottom: 14px; }
  .pin-pad button{ padding: 16px 0; font-size:16px; border-radius:6px; }
  #biometricBtn{ width:100%; margin-top: 4px; }
  #lockError{ color: var(--coral); font-size:11.5px; min-height:16px; margin-bottom:6px; }

  /* ---------- App shell ---------- */
  .app{ display:none; flex-direction:column; height:100vh; height:100dvh; }
  .app.show{ display:flex; }

  #topbar{
    display:flex; align-items:center; gap:10px;
    padding: max(12px, env(safe-area-inset-top)) 16px 10px;
    border-bottom: 1px solid var(--line);
    background: rgba(11,31,51,0.85);
  }
  #topbar .word{ font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:14px; letter-spacing:.08em; text-transform:uppercase; color: var(--teal); }
  #topbar .spacer{ flex:1; }

  /* ---------- Carousel ---------- */
  .carousel{
    flex:1; display:flex; gap:14px; overflow-x:auto; overflow-y:hidden;
    scroll-snap-type: x mandatory; -webkit-overflow-scrolling:touch;
    padding: 14px 5%; scroll-padding: 0 5%;
    min-height:0;
  }
  .carousel::-webkit-scrollbar{ display:none; }
  .tab-card{
    flex: 0 0 90%; scroll-snap-align:center;
    background: var(--card); border:1px solid var(--line); border-radius:16px;
    display:flex; flex-direction:column; overflow:hidden;
    box-shadow: 0 10px 28px rgba(3,10,20,.5);
    min-height:0;
  }
  .label-bar{
    display:flex; align-items:center; gap:8px;
    padding: 9px 10px; border-bottom:1px solid var(--line);
    background: rgba(16,42,67,.9);
  }
  .label-bar .fname{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:12px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .icon-btn{ padding: 5px 8px; font-size:13px; line-height:1; }
  .tab-card iframe{ flex:1; border:none; background:#fff; min-height:0; }

  .fc-tag{ font-family:'IBM Plex Mono', monospace; font-size:9.5px; letter-spacing:.06em; padding: 2px 6px; border-radius:2px; white-space:nowrap; text-transform:uppercase; flex-shrink:0; }
  .fc-tag.html{ background: rgba(94,234,212,.15); color: var(--teal); border:1px solid rgba(94,234,212,.4); }
  .fc-tag.jsx{ background: rgba(240,195,109,.15); color: var(--amber); border:1px solid rgba(240,195,109,.4); }

  .empty-carousel{
    flex:1; display:flex; align-items:center; justify-content:center; text-align:center;
    color: var(--ink-dim); font-size:13px; line-height:1.7; padding: 40px;
  }

  /* ---------- Dots ---------- */
  #dots{ display:flex; justify-content:center; align-items:center; gap:7px; padding: 4px 0 max(14px, env(safe-area-inset-bottom)); }
  .dot{ width:7px; height:7px; border-radius:50%; background: var(--line); transition: all .15s ease; }
  .dot.active{ background: var(--teal); width:20px; border-radius:5px; }

  /* ---------- FAB ---------- */
  #addTabBtn{
    position:fixed; right:18px; bottom: max(70px, calc(env(safe-area-inset-bottom) + 58px));
    width:52px; height:52px; border-radius:50%;
    font-size:24px; font-weight:600; padding:0;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 18px rgba(0,0,0,.4); z-index:40;
  }

  /* ---------- Library bottom sheet ---------- */
  .sheet-overlay{
    position:fixed; inset:0; background: rgba(6,15,25,.7);
    display:none; align-items:flex-end; justify-content:center; z-index:60;
  }
  .sheet-overlay.show{ display:flex; }
  .sheet{
    width:100%; max-width:640px; max-height:80vh; overflow-y:auto;
    background: var(--card); border:1px solid var(--line); border-bottom:none;
    border-radius: 16px 16px 0 0; padding: 6px 16px calc(20px + env(safe-area-inset-bottom));
  }
  .sheet-handle{ width:36px; height:4px; background:var(--line); border-radius:3px; margin: 10px auto 14px; }
  .sheet-top{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .sheet-top h3{ margin:0; font-family:'IBM Plex Mono', monospace; font-size:14px; color:var(--teal); flex:1; }
  .lib-row{ display:flex; align-items:center; gap:10px; padding: 11px 4px; border-bottom:1px dashed var(--line); }
  .lib-row:last-child{ border-bottom:none; }
  .lib-info{ flex:1; min-width:0; }
  .lib-name{ font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:12.5px; word-break:break-word; }
  .lib-meta{ font-size:10.5px; color:var(--ink-dim); margin-top:5px; display:flex; align-items:center; gap:6px; font-family:'IBM Plex Mono', monospace; }
  .lib-actions{ display:flex; gap:6px; flex-shrink:0; }
  .empty-note{ color:var(--ink-dim); font-size:12.5px; padding: 18px 4px; line-height:1.6; }

  /* ---------- Code editor overlay ---------- */
  .code-overlay{ position:fixed; inset:0; background: var(--bg); z-index:80; display:none; flex-direction:column; }
  .code-overlay.show{ display:flex; }
  .code-header{ display:flex; align-items:center; gap:10px; padding: max(12px, env(safe-area-inset-top)) 16px 10px; border-bottom:1px solid var(--line); flex-wrap:wrap; background: rgba(11,31,51,0.85); }
  .code-header .name{ font-family:'IBM Plex Mono', monospace; font-size:13.5px; font-weight:600; }
  .code-header .spacer{ flex:1; }
  textarea#codeArea{
    flex:1; width:100%; resize:none; border:none; outline:none;
    background: #0A1826; color: #D6E8F5;
    font-family:'IBM Plex Mono', monospace; font-size:12.5px; line-height:1.6;
    padding: 16px 18px;
  }

  /* ---------- New-file modal ---------- */
  .overlay{ position:fixed; inset:0; background: rgba(6,15,25,.7); display:none; align-items:center; justify-content:center; z-index:90; }
  .overlay.show{ display:flex; }
  .modal{ width: min(560px, 92vw); max-height: 86vh; overflow-y:auto; background: var(--card); border:1px solid var(--line); border-radius:10px; padding: 20px 22px 22px; }
  .modal h3{ margin:0 0 14px; font-family:'IBM Plex Mono', monospace; font-size:14px; color:var(--teal); }
  .field{ margin-bottom: 12px; }
  .field label{ display:block; font-size:11px; color:var(--ink-dim); margin-bottom:5px; font-family:'IBM Plex Mono', monospace; letter-spacing:.03em; }
  .field input[type=text], .field select{
    width:100%; padding: 8px 10px; background:#0A1826; border:1px solid var(--line); color:var(--ink);
    border-radius:3px; font-family:'IBM Plex Mono', monospace; font-size:12.5px;
  }
  .field textarea{ width:100%; min-height: 200px; padding: 10px; background:#0A1826; border:1px solid var(--line); color:var(--ink); border-radius:3px; font-family:'IBM Plex Mono', monospace; font-size:12px; line-height:1.55; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:8px; }
  .hint{ font-size:11px; color: var(--ink-dim); margin-top:-6px; margin-bottom:12px; line-height:1.5; }
  input[type=file]{ display:none; }

  /* ---------- Full screen: hides chrome, cards go edge-to-edge but stay swipeable ---------- */
  #exitFullscreenBtn{
    position:fixed; top: max(12px, env(safe-area-inset-top)); right:12px; z-index:50; display:none;
    background: rgba(16,42,67,.92); border-color: var(--teal); color: var(--teal);
    padding: 8px 12px; border-radius: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.4);
  }
  body.fullscreen-active #topbar,
  body.fullscreen-active #dots,
  body.fullscreen-active #addTabBtn,
  body.fullscreen-active .label-bar{ display:none !important; }
  body.fullscreen-active .carousel{ padding:0; gap:0; }
  body.fullscreen-active .tab-card{ flex-basis:100%; border-radius:0; border:none; }
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lock">
  <div class="pin-card">
    <h1>The Bench</h1>
    <p id="lockSubtitle">Set a passcode to protect your saved code.</p>
    <div class="pin-dots" id="pinDots"></div>
    <div id="lockError"></div>
    <div class="pin-pad" id="pinPad"></div>
    <button id="biometricBtn" style="display:none;">Use Face ID / Fingerprint</button>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <div id="topbar">
    <span class="word">The Bench</span>
    <span class="spacer"></span>
    <button id="libraryBtn" class="ghost" title="All files">📂 Library</button>
    <button id="lockNowBtn" class="ghost" title="Lock now">🔒</button>
  </div>

  <div class="carousel" id="carousel"></div>
  <div id="dots"></div>

  <button id="addTabBtn" class="primary" title="Open a file">+</button>
</div>

<button id="exitFullscreenBtn">✕ Exit full screen</button>

<!-- LIBRARY BOTTOM SHEET -->
<div class="sheet-overlay" id="librarySheetOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-top">
      <h3>Your files</h3>
      <button id="newFromSheetBtn" class="primary">+ New</button>
      <button id="importFromSheetBtn">Import</button>
      <input type="file" id="importInput" multiple accept=".html,.htm,.jsx,.tsx,.js">
    </div>
    <div id="libraryList"></div>
  </div>
</div>

<!-- CODE EDITOR OVERLAY -->
<div class="code-overlay" id="codeOverlay">
  <div class="code-header">
    <button id="codeBackBtn" class="ghost">← Back</button>
    <span class="fc-tag" id="codeTag"></span>
    <span class="name" id="codeFname"></span>
    <span class="spacer"></span>
    <button id="codeRenameBtn" class="ghost">Rename</button>
    <button id="codeExportBtn">Export</button>
    <button id="codeDeleteBtn" class="danger">Delete</button>
  </div>
  <textarea id="codeArea" spellcheck="false"></textarea>
</div>

<!-- NEW FILE MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">New file</h3>
    <div class="field">
      <label>Name</label>
      <input type="text" id="mName" placeholder="e.g. pricing-table">
    </div>
    <div class="field">
      <label>Type</label>
      <select id="mType">
        <option value="html">HTML</option>
        <option value="jsx">JSX (React component)</option>
      </select>
    </div>
    <div class="field">
      <label>Code</label>
      <textarea id="mCode" placeholder="Paste or write code here..."></textarea>
    </div>
    <div class="hint" id="mHint"></div>
    <div class="modal-actions">
      <button class="ghost" id="mCancel">Cancel</button>
      <button class="primary" id="mSave">Save &amp; open</button>
    </div>
  </div>
</div>

<script>
/* ===================== Service worker registration ===================== */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}

/* ===================== IndexedDB storage layer ===================== */
const DB_NAME = 'bench-db';
const STORE = 'files';
const KV_STORE = 'kv';
let db;

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 2);
    req.onupgradeneeded = () => {
      const d = req.result;
      if(!d.objectStoreNames.contains(STORE)){
        d.createObjectStore(STORE, { keyPath: 'id' });
      }
      if(!d.objectStoreNames.contains(KV_STORE)){
        d.createObjectStore(KV_STORE, { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

/* ---- kv helpers, back the window.storage shim used by previewed artifacts ---- */
function kvGet(id){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(KV_STORE, 'readonly');
    const req = tx.objectStore(KV_STORE).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
function kvSet(id, record){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(KV_STORE, 'readwrite');
    tx.objectStore(KV_STORE).put({ id, ...record });
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function kvDelete(id){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(KV_STORE, 'readwrite');
    tx.objectStore(KV_STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function kvListKeys(prefixTag, userPrefix){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(KV_STORE, 'readonly');
    const req = tx.objectStore(KV_STORE).getAll();
    req.onsuccess = () => {
      const rows = req.result || [];
      const keys = rows
        .filter(r => r.id.startsWith(prefixTag))
        .map(r => r.key)
        .filter(k => !userPrefix || k.startsWith(userPrefix));
      resolve(keys);
    };
    req.onerror = () => reject(req.error);
  });
}

/* Bridge: previewed HTML/JSX runs in a sandboxed iframe with no direct DB access.
   It talks to window.storage (shimmed inside the iframe) via postMessage; this
   listener performs the real IndexedDB work and posts the result back. */
window.addEventListener('message', async (e) => {
  const d = e.data;
  if(!d || !d.__benchStorage || !e.source) return;
  const { id, op, args } = d;
  try{
    const result = await handleStorageOp(op, args || {});
    e.source.postMessage({ __benchStorageResponse: true, id, result }, '*');
  }catch(err){
    e.source.postMessage({ __benchStorageResponse: true, id, error: err.message || String(err) }, '*');
  }
});

/* File bridge: sandboxed previews can't download or open the share sheet.
   A tool posts { __benchFile, id, name, mime, prefer, data:ArrayBuffer } and
   The Bench saves it from the top-level page, then replies with the result. */
window.addEventListener('message', async (e) => {
  const d = e.data;
  if(!d || !d.__benchFile || !e.source) return;
  const reply = (ok, how, error) => e.source.postMessage({ __benchFileResponse: true, id: d.id, ok, how, error }, '*');
  try{
    const blob = new Blob([d.data], { type: d.mime || 'application/octet-stream' });
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if(d.prefer !== 'download' && isMobile && navigator.canShare){
      const file = new File([blob], d.name, { type: blob.type });
      if(navigator.canShare({ files: [file] })){
        try{ await navigator.share({ files: [file], title: d.name }); return reply(true, 'share'); }
        catch(err){ if(err && err.name === 'AbortError') return reply(true, 'cancelled'); }
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = d.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    reply(true, 'download');
  }catch(err){
    reply(false, null, (err && err.message) || String(err));
  }
});

async function handleStorageOp(op, { key, value, shared, prefix }){
  const tag = shared ? 'shared:' : 'priv:';
  const storeId = tag + key;
  if(op === 'get'){
    const rec = await kvGet(storeId);
    if(!rec) throw new Error('Key not found: ' + key);
    return { key, value: rec.value, shared: !!shared };
  }
  if(op === 'set'){
    await kvSet(storeId, { key, value, shared: !!shared });
    return { key, value, shared: !!shared };
  }
  if(op === 'delete'){
    const existed = await kvGet(storeId);
    await kvDelete(storeId);
    return { key, deleted: !!existed, shared: !!shared };
  }
  if(op === 'list'){
    const keys = await kvListKeys(tag, prefix);
    return { keys, prefix, shared: !!shared };
  }
  throw new Error('Unknown storage op: ' + op);
}
function dbGetAll(){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
function dbPut(file){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(file);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function dbDelete(id){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ===================== Lock screen: PIN + WebAuthn ===================== */
const lockEl = document.getElementById('lock');
const pinDotsEl = document.getElementById('pinDots');
const pinPadEl = document.getElementById('pinPad');
const lockErrorEl = document.getElementById('lockError');
const lockSubtitleEl = document.getElementById('lockSubtitle');
const biometricBtn = document.getElementById('biometricBtn');

const PIN_LEN = 4;
let pinBuffer = '';
let mode = null; // 'setup' | 'confirm' | 'unlock'
let firstPinEntry = '';

async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function renderDots_pin(){
  pinDotsEl.innerHTML = '';
  for(let i=0;i<PIN_LEN;i++){
    const d = document.createElement('div');
    d.className = 'pin-dot' + (i < pinBuffer.length ? ' filled' : '');
    pinDotsEl.appendChild(d);
  }
}
function buildPad(){
  pinPadEl.innerHTML = '';
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  keys.forEach(k => {
    const b = document.createElement('button');
    b.textContent = k;
    if(k === ''){ b.style.visibility = 'hidden'; }
    b.onclick = () => handleKey(k);
    pinPadEl.appendChild(b);
  });
}
function handleKey(k){
  lockErrorEl.textContent = '';
  if(k === '⌫'){ pinBuffer = pinBuffer.slice(0,-1); renderDots_pin(); return; }
  if(k === '' || pinBuffer.length >= PIN_LEN) return;
  pinBuffer += k;
  renderDots_pin();
  if(pinBuffer.length === PIN_LEN) setTimeout(submitPin, 150);
}

async function submitPin(){
  if(mode === 'setup'){
    firstPinEntry = pinBuffer;
    pinBuffer = '';
    renderDots_pin();
    mode = 'confirm';
    lockSubtitleEl.textContent = 'Enter it again to confirm.';
    return;
  }
  if(mode === 'confirm'){
    if(pinBuffer !== firstPinEntry){
      lockErrorEl.textContent = "Passcodes didn't match — try again.";
      pinBuffer = ''; firstPinEntry=''; renderDots_pin();
      mode = 'setup';
      lockSubtitleEl.textContent = 'Set a passcode to protect your saved code.';
      return;
    }
    const hash = await sha256(pinBuffer);
    localStorage.setItem('bench-pin-hash', hash);
    unlockApp();
    return;
  }
  if(mode === 'unlock'){
    const hash = await sha256(pinBuffer);
    const stored = localStorage.getItem('bench-pin-hash');
    if(hash === stored){
      unlockApp();
    } else {
      lockErrorEl.textContent = 'Wrong passcode.';
      pinBuffer = ''; renderDots_pin();
    }
  }
}

function startLockFlow(){
  buildPad();
  const stored = localStorage.getItem('bench-pin-hash');
  pinBuffer = '';
  if(stored){
    mode = 'unlock';
    lockSubtitleEl.textContent = 'Enter your passcode.';
    maybeShowBiometric();
  } else {
    mode = 'setup';
    lockSubtitleEl.textContent = 'Set a 4-digit passcode to protect your saved code.';
  }
  renderDots_pin();
}

function unlockApp(){
  lockEl.style.display = 'none';
  document.getElementById('app').classList.add('show');
  loadFiles();
}

document.getElementById('lockNowBtn').onclick = () => {
  document.getElementById('app').classList.remove('show');
  lockEl.style.display = 'flex';
  mode = 'unlock';
  pinBuffer = '';
  lockSubtitleEl.textContent = 'Enter your passcode.';
  lockErrorEl.textContent = '';
  renderDots_pin();
  buildPad();
  maybeShowBiometric();
};

/* Optional: WebAuthn (Face ID / fingerprint) as a faster unlock, layered on top of the PIN. */
async function maybeShowBiometric(){
  if(!window.PublicKeyCredential) return;
  const available = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().catch(()=>false);
  if(!available) return;
  biometricBtn.style.display = 'block';
}
biometricBtn.onclick = async () => {
  try{
    let credId = localStorage.getItem('bench-webauthn-id');
    if(!credId){
      const cred = await navigator.credentials.create({
        publicKey: {
          challenge: crypto.getRandomValues(new Uint8Array(32)),
          rp: { name: 'The Bench' },
          user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'bench-user', displayName: 'Bench User' },
          pubKeyCredParams: [{ type:'public-key', alg:-7 }, { type:'public-key', alg:-257 }],
          authenticatorSelection: { userVerification: 'required', authenticatorAttachment: 'platform' },
          timeout: 60000
        }
      });
      localStorage.setItem('bench-webauthn-id', cred.id);
      unlockApp();
      return;
    }
    await navigator.credentials.get({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        userVerification: 'required',
        timeout: 60000
      }
    });
    unlockApp();
  }catch(e){
    lockErrorEl.textContent = 'Biometric unlock failed — use your passcode.';
  }
};

startLockFlow();

/* ===================== Library / CDN globals / JSX preview ===================== */
const el = (id) => document.getElementById(id);
const JSX_HINT = 'JSX files run through Babel + React in the preview. Define a component (e.g. "function App(){...}") and end with "export default App;" — imports of react/react-dom are stripped automatically.';
const HTML_HINT = 'Full HTML documents run as-is in a sandboxed preview frame.';

const LIB_GLOBALS = {
  'react': 'React',
  'lucide-react': 'LucideReact',
  'recharts': 'Recharts',
  'lodash': '_',
  'papaparse': 'Papa',
  'xlsx': 'XLSX',
  'd3': 'd3',
  'mathjs': 'math',
  'tone': 'Tone',
  'three': 'THREE',
  'chart.js': 'Chart'
};

const LIB_SCRIPTS = `
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"><\/script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"><\/script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"><\/script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"><\/script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"><\/script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.0/math.js"><\/script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"><\/script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"><\/script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"><\/script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>
<script src="https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.js"><\/script>
<script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"><\/script>
`;

function transformImports(code){
  const importRe = /^\s*import\s+([^;]+?)\s+from\s+['"]([^'"]+)['"];?\s*$/gm;
  const unresolved = [];
  const transformed = code.replace(importRe, (match, clause, mod) => {
    const key = mod.toLowerCase();
    const globalName = LIB_GLOBALS[key];
    if(!globalName){ unresolved.push(mod); return `/* stripped: import from "${mod}" not available in preview */`; }
    clause = clause.trim();
    if(clause.startsWith('{')){
      return `const ${clause} = ${globalName};`;
    }
    if(clause.startsWith('*')){
      const m = clause.match(/\*\s+as\s+(\w+)/);
      const ns = m ? m[1] : key.replace(/[^a-zA-Z0-9_]/g,'_');
      return `const ${ns} = ${globalName};`;
    }
    const defName = clause.split(',')[0].trim();
    return `const ${defName} = ${globalName};`;
  });
  return { transformed, unresolved };
}

const STORAGE_SHIM = `
<script>
window.storage = (function(){
  let reqId = 0;
  const pending = {};
  window.addEventListener('message', (e) => {
    const d = e.data;
    if(d && d.__benchStorageResponse && pending[d.id]){
      const p = pending[d.id];
      delete pending[d.id];
      if(d.error) p.reject(new Error(d.error));
      else p.resolve(d.result);
    }
  });
  function call(op, args){
    return new Promise((resolve, reject) => {
      const id = ++reqId;
      pending[id] = { resolve, reject };
      window.parent.postMessage({ __benchStorage: true, id, op, args }, '*');
    });
  }
  return {
    get: (key, shared) => call('get', { key, shared: !!shared }),
    set: (key, value, shared) => call('set', { key, value, shared: !!shared }),
    delete: (key, shared) => call('delete', { key, shared: !!shared }),
    list: (prefix, shared) => call('list', { prefix, shared: !!shared })
  };
})();
<\/script>
`;

function buildJsxDoc(code){
  const { transformed, unresolved } = transformImports(code);
  const cleaned = transformed.replace(/export\s+default\s+/, 'window.__WB_App = ');
  const warn = unresolved.length
    ? `console.warn('Bench preview: no CDN mapping for: ${unresolved.join(', ').replace(/'/g,"\\'")}. Those imports were stripped.');`
    : '';

  return `<!DOCTYPE html>
<html><head><meta charset="UTF-8">
${LIB_SCRIPTS}
${STORAGE_SHIM}
<style>html,body{margin:0;padding:0;font-family:sans-serif;}#root{min-height:100vh;}</style>
</head><body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback, useReducer, useContext, createContext } = React;
${warn}
try {
${cleaned}
  const rootEl = document.getElementById('root');
  const root = ReactDOM.createRoot(rootEl);
  if (typeof window.__WB_App !== 'undefined') {
    root.render(React.createElement(window.__WB_App));
  } else {
    rootEl.innerHTML = '<div style="padding:24px;font-family:monospace;color:#b00">No default export found. End your file with: export default ComponentName;</div>';
  }
} catch (err) {
  document.getElementById('root').innerHTML = '<pre style="padding:24px;color:#b00;white-space:pre-wrap;font-family:monospace;">' + err.message + '</pre>';
}
<\/script>
</body></html>`;
}
function docFor(f){
  if(f.type !== 'html') return buildJsxDoc(f.code);
  /* Put the shim inside <head> so a file's <!doctype> stays first and the
     page renders in standards mode instead of quirks mode. */
  const code = f.code;
  const m = code.match(/<head[^>]*>/i);
  if(m){
    const at = m.index + m[0].length;
    return code.slice(0, at) + STORAGE_SHIM + code.slice(at);
  }
  return STORAGE_SHIM + code;
}

/* ===================== File store + open tabs ===================== */
let files = [];             // every saved file: {id,name,type,code,createdAt,updatedAt,open,tabIndex}
let currentCardIndex = 0;   // which open tab is centered in the carousel
let codeEditingId = null;

function uid(){ return 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
function openFilesSorted(){
  return files.filter(f => f.open).sort((a,b) => (a.tabIndex ?? 0) - (b.tabIndex ?? 0));
}

async function loadFiles(){
  db = await openDB();
  files = await dbGetAll();
  renderCarousel();
}

/* ---- Carousel (swipeable tab cards) ---- */
function renderCarousel(){
  const carousel = el('carousel');
  const dotsEl = el('dots');
  const openList = openFilesSorted();

  if(openList.length === 0){
    carousel.innerHTML = '<div class="empty-carousel">No tabs open yet.<br>Tap the <strong>+</strong> button to open a saved file, or add a new one.</div>';
    dotsEl.innerHTML = '';
    return;
  }

  carousel.innerHTML = openList.map(f => `
    <div class="tab-card" data-id="${f.id}">
      <div class="label-bar">
        <span class="fc-tag ${f.type}">${f.type}</span>
        <span class="fname">${escapeHtml(f.name)}</span>
        <button class="icon-btn ghost" data-action="code" title="View code">&lt;/&gt;</button>
        <button class="icon-btn ghost" data-action="fullscreen" title="Full screen">⛶</button>
        <button class="icon-btn ghost" data-action="close" title="Close tab">✕</button>
      </div>
      <iframe data-frame="${f.id}" sandbox="allow-scripts allow-modals" srcdoc=""></iframe>
    </div>
  `).join('');

  dotsEl.innerHTML = openList.map((f,i) => `<div class="dot${i===0?' active':''}" data-idx="${i}"></div>`).join('');

  openList.forEach(f => {
    const frame = carousel.querySelector(`iframe[data-frame="${f.id}"]`);
    if(frame) frame.srcdoc = docFor(f);
  });

  if(currentCardIndex >= openList.length) currentCardIndex = Math.max(0, openList.length - 1);
}

el('carousel').addEventListener('click', (e) => {
  const btn = e.target.closest('.icon-btn');
  if(!btn) return;
  const card = e.target.closest('.tab-card');
  const id = card.dataset.id;
  const action = btn.dataset.action;
  if(action === 'close') closeTab(id);
  if(action === 'code') openCodeEditor(id);
  if(action === 'fullscreen'){
    const idx = [...card.parentElement.children].indexOf(card);
    currentCardIndex = idx;
    enterFullscreen();
  }
});

let scrollTicking = false;
el('carousel').addEventListener('scroll', () => {
  if(scrollTicking) return;
  scrollTicking = true;
  requestAnimationFrame(() => {
    const carousel = el('carousel');
    const cards = [...carousel.querySelectorAll('.tab-card')];
    if(cards.length){
      const mid = carousel.scrollLeft + carousel.clientWidth/2;
      let closest = 0, closestDist = Infinity;
      cards.forEach((c,i) => {
        const cMid = c.offsetLeft + c.offsetWidth/2;
        const dist = Math.abs(cMid - mid);
        if(dist < closestDist){ closestDist = dist; closest = i; }
      });
      currentCardIndex = closest;
      document.querySelectorAll('.dot').forEach((d,i) => d.classList.toggle('active', i===closest));
    }
    scrollTicking = false;
  });
});

el('dots').addEventListener('click', (e) => {
  const dot = e.target.closest('.dot');
  if(!dot) return;
  const idx = +dot.dataset.idx;
  const cards = el('carousel').querySelectorAll('.tab-card');
  if(cards[idx]) cards[idx].scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
});

async function closeTab(id){
  const f = files.find(x=>x.id===id);
  if(!f) return;
  f.open = false;
  await dbPut(f);
  renderCarousel();
}

async function openTab(id){
  const f = files.find(x=>x.id===id);
  if(!f) return;
  if(!f.open){
    const maxIdx = Math.max(-1, ...files.filter(x=>x.open).map(x => x.tabIndex ?? 0));
    f.open = true;
    f.tabIndex = maxIdx + 1;
    await dbPut(f);
  }
  renderCarousel();
  closeLibrarySheet();
  requestAnimationFrame(() => {
    const card = el('carousel').querySelector(`.tab-card[data-id="${id}"]`);
    if(card) card.scrollIntoView({ inline:'center', block:'nearest' });
  });
}

/* ---- Full screen: hides chrome; cards go edge-to-edge, still swipeable ---- */
function enterFullscreen(){
  document.body.classList.add('fullscreen-active');
  el('exitFullscreenBtn').style.display = 'block';
  requestAnimationFrame(() => {
    const cards = el('carousel').querySelectorAll('.tab-card');
    if(cards[currentCardIndex]) cards[currentCardIndex].scrollIntoView({ inline:'center', block:'nearest' });
  });
}
function exitFullscreen(){
  document.body.classList.remove('fullscreen-active');
  el('exitFullscreenBtn').style.display = 'none';
  requestAnimationFrame(() => {
    const cards = el('carousel').querySelectorAll('.tab-card');
    if(cards[currentCardIndex]) cards[currentCardIndex].scrollIntoView({ inline:'center', block:'nearest' });
  });
}
el('exitFullscreenBtn').onclick = exitFullscreen;

/* ---- Library bottom sheet: every saved file, open/import/delete ---- */
function renderLibrary(){
  const body = el('libraryList');
  if(files.length === 0){
    body.innerHTML = '<div class="empty-note">No files saved yet. Use "+ New" or "Import" above.</div>';
    return;
  }
  const sorted = [...files].sort((a,b) => b.updatedAt - a.updatedAt);
  body.innerHTML = sorted.map(f => `
    <div class="lib-row" data-id="${f.id}">
      <div class="lib-info">
        <div class="lib-name">${escapeHtml(f.name)}</div>
        <div class="lib-meta"><span class="fc-tag ${f.type}">${f.type}</span> ${f.code.split('\n').length} lines · ${timeAgo(f.updatedAt)}</div>
      </div>
      <div class="lib-actions">
        <button class="primary" data-action="open">${f.open ? 'Jump to' : 'Open'}</button>
        <button class="danger" data-action="delete">Delete</button>
      </div>
    </div>
  `).join('');
}
el('libraryList').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if(!btn) return;
  const row = e.target.closest('.lib-row');
  const id = row.dataset.id;
  if(btn.dataset.action === 'open') openTab(id);
  if(btn.dataset.action === 'delete') deleteFromLibrary(id);
});
async function deleteFromLibrary(id){
  const f = files.find(x=>x.id===id);
  if(!f) return;
  if(!confirm(`Delete "${f.name}"? This can't be undone.`)) return;
  await dbDelete(id);
  files = files.filter(x=>x.id!==id);
  renderCarousel();
  renderLibrary();
}

function openLibrary(){ renderLibrary(); el('librarySheetOverlay').classList.add('show'); }
function closeLibrarySheet(){ el('librarySheetOverlay').classList.remove('show'); }
el('libraryBtn').onclick = openLibrary;
el('addTabBtn').onclick = openLibrary;
el('librarySheetOverlay').addEventListener('click', (e) => {
  if(e.target.id === 'librarySheetOverlay') closeLibrarySheet();
});

/* ---- Code editor overlay (also handles rename / export / delete) ---- */
function openCodeEditor(id){
  const f = files.find(x=>x.id===id);
  if(!f) return;
  codeEditingId = id;
  el('codeFname').textContent = f.name;
  el('codeTag').textContent = f.type;
  el('codeTag').className = 'fc-tag ' + f.type;
  el('codeArea').value = f.code;
  el('codeOverlay').classList.add('show');
}
async function saveCodeEdits(){
  if(!codeEditingId) return;
  const f = files.find(x=>x.id===codeEditingId);
  if(!f) return;
  const newCode = el('codeArea').value;
  if(newCode !== f.code){
    f.code = newCode;
    f.updatedAt = Date.now();
    await dbPut(f);
    const frame = document.querySelector(`iframe[data-frame="${f.id}"]`);
    if(frame) frame.srcdoc = docFor(f);
  }
}
el('codeBackBtn').onclick = async () => {
  await saveCodeEdits();
  el('codeOverlay').classList.remove('show');
  codeEditingId = null;
};
el('codeRenameBtn').onclick = async () => {
  const f = files.find(x=>x.id===codeEditingId);
  if(!f) return;
  const newName = prompt('Rename file', f.name);
  if(newName && newName.trim()){
    f.name = newName.trim();
    f.updatedAt = Date.now();
    await dbPut(f);
    el('codeFname').textContent = f.name;
    renderCarousel();
  }
};
el('codeExportBtn').onclick = () => {
  const f = files.find(x=>x.id===codeEditingId);
  if(!f) return;
  const ext = f.type === 'html' ? 'html' : 'jsx';
  const blob = new Blob([el('codeArea').value], {type: 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = f.name.endsWith('.'+ext) ? f.name : `${f.name}.${ext}`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
};
el('codeDeleteBtn').onclick = async () => {
  const f = files.find(x=>x.id===codeEditingId);
  if(!f) return;
  if(!confirm(`Delete "${f.name}"? This can't be undone.`)) return;
  await dbDelete(f.id);
  files = files.filter(x=>x.id!==f.id);
  codeEditingId = null;
  el('codeOverlay').classList.remove('show');
  renderCarousel();
};

/* ---- New file / import (both open the result as a tab immediately) ---- */
const overlay = el('overlay');
el('newFromSheetBtn').onclick = () => openNewFileModal();
el('mCancel').onclick = closeModal;
el('mType').onchange = () => {
  el('mHint').textContent = el('mType').value === 'jsx' ? JSX_HINT : HTML_HINT;
};
function openNewFileModal(){
  el('modalTitle').textContent = 'New file';
  el('mName').value = '';
  el('mType').value = 'html';
  el('mCode').value = '';
  el('mHint').textContent = HTML_HINT;
  overlay.classList.add('show');
  el('mName').focus();
}
function closeModal(){ overlay.classList.remove('show'); }
overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });

el('mSave').onclick = async () => {
  const name = el('mName').value.trim();
  const type = el('mType').value;
  const code = el('mCode').value;
  if(!name){ el('mName').focus(); return; }
  if(!code.trim()){ el('mCode').focus(); return; }
  const now = Date.now();
  const maxIdx = Math.max(-1, ...files.filter(x=>x.open).map(x => x.tabIndex ?? 0));
  const newFile = { id: uid(), name, type, code, createdAt: now, updatedAt: now, open: true, tabIndex: maxIdx+1 };
  files.push(newFile);
  await dbPut(newFile);
  closeModal();
  closeLibrarySheet();
  renderCarousel();
  requestAnimationFrame(() => {
    const card = el('carousel').querySelector(`.tab-card[data-id="${newFile.id}"]`);
    if(card) card.scrollIntoView({ inline:'center', block:'nearest' });
  });
};

el('importFromSheetBtn').onclick = () => el('importInput').click();
el('importInput').onchange = async (e) => {
  const fileObjs = Array.from(e.target.files || []);
  let maxIdx = Math.max(-1, ...files.filter(x=>x.open).map(x => x.tabIndex ?? 0));
  let lastId = null;
  for(const fo of fileObjs){
    const text = await fo.text();
    const ext = fo.name.split('.').pop().toLowerCase();
    const type = (ext === 'jsx' || ext === 'tsx' || ext === 'js') ? 'jsx' : 'html';
    const name = fo.name.replace(/\.(html|htm|jsx|tsx|js)$/i, '');
    const now = Date.now();
    maxIdx += 1;
    const newFile = { id: uid(), name, type, code: text, createdAt: now, updatedAt: now, open: true, tabIndex: maxIdx };
    files.push(newFile);
    await dbPut(newFile);
    lastId = newFile.id;
  }
  closeLibrarySheet();
  renderCarousel();
  if(lastId){
    requestAnimationFrame(() => {
      const card = el('carousel').querySelector(`.tab-card[data-id="${lastId}"]`);
      if(card) card.scrollIntoView({ inline:'center', block:'nearest' });
    });
  }
  e.target.value = '';
};
</script>
</body>
